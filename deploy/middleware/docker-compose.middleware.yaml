# Local middleware stack for kratos-micro-layout.
#
#   make middleware-up      # docker compose -f deploy/middleware/docker-compose.middleware.yaml up -d
#   make middleware-down
#
# Every credential/port below is parameterized as ${VAR:-default}; the defaults
# match configs/*.yaml so the stack runs with NO .env at all. Copy .env.example
# to .env (same directory) to override anything — see deploy/middleware/README.md.
#
# What runs here, and what it is for:
#
#   mysql   :3306  the only database the template ships a driver for. The
#                  `user_center` schema is created on first boot; ent then
#                  creates the tables (data.database.auto_migrate) — see
#                  docs/ent.md for turning that into reviewed migrations.
#   redis   :6379  reserved for caches/sessions. configs/user_center.yaml has
#                  the data.redis block, but no code reads it yet.
#   nacos   :8848  service registry AND config center. Optional: leave
#            :9848  configs/*.yaml `registry.address` empty and everything
#                  except the gateway works without it (the gateway must be
#                  able to discover its backends).
#
# Opt-in (NOT started by `make middleware-up`, so the default stack stays light):
#
#   elasticsearch :9200/:9300  +  kibana :5601  live under the `search` profile.
#                  Nothing in the template reads them yet — they are here for
#                  log/metric search when you wire it up. Start with:
#                    docker compose -f deploy/middleware/docker-compose.middleware.yaml \
#                      --profile search up -d
#                  ES needs `vm.max_map_count >= 262144` on the host:
#                    sudo sysctl -w vm.max_map_count=262144
#
# Ports, credentials and image tags are local-development defaults, not a
# production manifest: nothing here is TLS-terminated, backed up, or hardened.
# Bump the tags to match your environment — Nacos 3.x also speaks to the 2.x Go
# SDK this repo uses, and MySQL/PostgreSQL are interchangeable from the service's
# point of view (see the commented DSN in configs/user_center.yaml).
#
# If a port is already taken (a local MySQL, or an SSH tunnel forwarding a
# remote one), `up` fails with "address already in use" — either free the port
# or change only the host side via the *_PORT vars in .env (e.g. MYSQL_PORT=13306)
# and point KRATOS_DB_SOURCE at it.

name: kratos-micro-layout-middleware

networks:
  middleware_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  nacos_logs:
  es_data:

services:
  mysql:
    image: mysql:8.4
    container_name: kratos-mysql
    restart: unless-stopped
    cpus: 2
    mem_limit: 4g
    # NOTE: no `user:` override on purpose. The official entrypoint must chown a
    # fresh named volume on first boot; forcing an arbitrary uid (e.g. 999:999)
    # makes that init fail with a permission error. It already drops to the
    # `mysql` user after init.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=1000
      - --slow_query_log=ON
      - --long_query_time=1
      - --local-infile=0
      - --innodb_buffer_pool_size=2G
      - --innodb_buffer_pool_instances=2
      - --sort_buffer_size=2M
      - --join_buffer_size=1M
      - --tmp_table_size=64M
      - --max_heap_table_size=64M
    environment:
      # Defaults match the DSN in configs/user_center.yaml (root:123456/user_center).
      # Override both together (or set KRATOS_DB_SOURCE) for anything but local dev.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-user_center}
      # Optional scoped account; left empty = not created (see .env.example).
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Drop *.sql / *.sh here to seed the DB on FIRST boot (empty data dir only).
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - middleware_net

  redis:
    image: redis:7.4-alpine
    container_name: kratos-redis
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-768mb} --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 8s
      timeout: 3s
      retries: 5
    networks:
      - middleware_net

  nacos:
    image: nacos/nacos-server:v2.5.4
    container_name: kratos-nacos
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    environment:
      # Standalone mode uses the embedded Derby store, so no external DB is needed.
      MODE: standalone
      TZ: ${TZ:-Asia/Shanghai}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-512m}
      JVM_XMN: ${NACOS_JVM_XMN:-256m}
      # Auth is OFF by default so configs/*.yaml (empty registry.username/password)
      # and the gateway work unchanged. To turn it on: set NACOS_AUTH_ENABLE=true,
      # fill the three NACOS_AUTH_* secrets in .env (generation commands in
      # .env.example), AND set registry.username/password (default nacos/nacos) in
      # every service config — details in deploy/middleware/README.md.
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
    ports:
      - "${NACOS_PORT:-8848}:8848" # HTTP API + console (http://localhost:8848/nacos, nacos/nacos)
      - "9848:9848"                # gRPC channel the Go SDK uses — publishing only 8848 hangs the client
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - middleware_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: kratos-es
    restart: unless-stopped
    profiles: ["search"] # opt in: docker compose --profile search up -d
    cpus: 2
    mem_limit: 2.5g
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms${ES_MEM_XMS:-1g} -Xmx${ES_MEM_XMX:-1g}"
      # Security on, TLS off: HTTP access with basic auth (dev only). Terminate
      # TLS at a reverse proxy in production.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      # Bootstrap password for the `elastic` superuser. CHANGE THIS via .env.
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
    ports:
      - "${ES_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-changeme} http://127.0.0.1:9200/_cluster/health | grep -q status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - middleware_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.2
    container_name: kratos-kibana
    restart: unless-stopped
    profiles: ["search"] # opt in: docker compose --profile search up -d
    cpus: 1.5
    mem_limit: 2g
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      # Dev default: the `elastic` superuser, so Kibana works out of the box.
      # In production switch to the least-privilege `kibana_system` account AFTER
      # resetting its password (POST /_security/user/kibana_system/_password) —
      # ELASTIC_PASSWORD does NOT set kibana_system's password.
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      I18N_LOCALE: zh-CN
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:5601/api/status | grep -q available"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - middleware_net
