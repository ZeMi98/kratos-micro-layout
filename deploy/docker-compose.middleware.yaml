# Local middleware stack for kratos-micro-layout.
#
#   make middleware-up      # docker compose -f deploy/docker-compose.middleware.yaml up -d
#   make middleware-down
#
# What runs here, and what it is for:
#
#   mysql   :3306  the only database the template ships a driver for. The
#                  `user_center` schema is created on first boot; ent then
#                  creates the tables (data.database.auto_migrate) — see
#                  docs/ent.md for turning that into reviewed migrations.
#   redis   :6379  reserved for caches/sessions. configs/user_center.yaml has
#                  the data.redis block, but no code reads it yet.
#   nacos   :8848  service registry AND config center. Optional: leave
#            :9848  configs/*.yaml `registry.address` empty and everything
#                  except the gateway works without it (the gateway must be
#                  able to discover its backends).
#
# Ports, credentials and image tags below are the local-development defaults
# that configs/*.yaml already point at. This is not a production manifest:
# nothing here is TLS-terminated, backed up, or resource-limited. Bump the tags
# to match your environment — Nacos 3.x also speaks to the 2.x Go SDK this repo
# uses, and MySQL/PostgreSQL are interchangeable from the service's point of
# view (see the commented DSN in configs/user_center.yaml).
#
# If a port is already taken (a local MySQL, or an SSH tunnel forwarding a
# remote one), `up` fails with "address already in use" — either free the port
# or change only the host side of the mapping ("13306:3306") and point
# KRATOS_DB_SOURCE at it.

name: kratos-micro-layout-middleware

services:
  mysql:
    image: mysql:8.4
    container_name: kratos-mysql
    restart: unless-stopped
    environment:
      # Matches the default DSN in configs/user_center.yaml. Override both
      # together (or set KRATOS_DB_SOURCE) for anything but local development.
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: user_center
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kratos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.5.4
    container_name: kratos-nacos
    restart: unless-stopped
    environment:
      # Standalone mode uses the embedded Derby store, so no external database
      # is needed. Auth stays off: the template reads registry.username /
      # password from config and expects them empty locally.
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848" # HTTP API + console (http://localhost:8848/nacos, nacos/nacos)
      - "9848:9848" # gRPC channel the Go SDK uses — publishing only 8848 hangs the client
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
