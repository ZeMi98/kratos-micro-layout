version: v2
inputs:
  - directory: api
plugins:
  # Go / gRPC / kratos-HTTP stubs for the whole api/ surface, emitted next to
  # their .proto sources (paths=source_relative).
  #
  # The OpenAPI document is deliberately NOT generated here. It lives in
  # buf.gen.openapi.yaml, which `make api` runs once per api/<domain> (passing
  # --path) so every service ships its OWN spec instead of one merged document
  # listing every service's RPCs. See pkg/docs for how they are embedded/served.
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: api
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: api
    opt: paths=source_relative
  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v3@v3.0.0-20260526000039-30da04b769dc"]
    out: api
    opt: paths=source_relative
