# OpenAPI 3 document, generated once per api/<domain>.
#
# `make api` loops over the first-level directories under api/ and runs this
# template with `--path api/<domain>`, so each run sees only that domain's
# protos and protoc-gen-openapi merges them into ONE per-domain document. The
# plugin always writes the fixed name openapi.yaml into `out`, so the Makefile
# stages it in .oapi/ (git-ignored) and moves it to
# pkg/docs/specs/<domain>/openapi.yaml, where pkg/docs embeds it and
# docs.Register(srv, "<domain>") serves it.
#
# Splitting per domain is what keeps a service's /swagger to the RPCs that
# service actually implements — a single merged document would list every
# service's RPCs under every service, and "try it out" would 404 on the ones it
# does not own.
#
# naming=proto and enum_type=string keep the spec faithful to what the service
# actually sends: pkg/middleware/codec.go marshals with protojson UseProtoNames
# (snake_case fields) and enums by name. The generator defaults (naming=json,
# enum_type=integer) would document lowerCamelCase fields and numeric enums that
# no client ever sees.
version: v2
inputs:
  - directory: api
plugins:
  - local: ["go", "run", "github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1"]
    out: .oapi
    strategy: all
    # NOTE: buf splits each option on commas before handing it to the plugin,
    # so title/description must stay comma-free or the remainder is parsed as
    # bogus flags ("no such flag -message").
    opt:
      - "title=Kratos Micro Layout API"
      - "description=HTTP API generated from api/**.proto. Bodies are protojson and every reply is wrapped in a code/message/data envelope."
      - version=1.0.0
      - naming=proto
      - enum_type=string
      - fq_schema_naming=true
      - default_response=false
