syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "validate/v1/validate.proto";

option go_package = "kratos-micro-layout/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "user.v1";

// AuthService handles registration, login, and token management.
service AuthService {
  // Register creates a new user account with credentials.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  // Login authenticates a user and returns tokens.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // Logout invalidates the current session.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  // RefreshToken exchanges a valid refresh token for a new token pair.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  // ChangePassword updates the authenticated user's password.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/change-password"
      body: "*"
    };
  }
}

// RegisterRequest is the request for Register.
//
// Constraints use protovalidate's declarative standard rules; the client-facing
// failure text is declared beside them with the shared (validate.v1.error_message)
// option (see pkg/validate/v1/validate.proto), because the standard rules carry
// no message hook of their own.
message RegisterRequest {
  // Login username. Must be unique.
  string username = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {min_len: 3, max_len: 64}
    },
    (validate.v1.error_message) = "username is required and must be between 3 and 64 characters"
  ];

  // Email address. Must be unique.
  string email = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {
        email: true
        max_len: 255
      }
    },
    (validate.v1.error_message) = "email is required and must be a valid address, e.g. alice@example.com"
  ];

  // Plain-text password. Must be 8-72 characters (bcrypt caps input at 72 bytes).
  string password = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {min_len: 8, max_len: 72}
    },
    (validate.v1.error_message) = "password is required and must be between 8 and 72 characters"
  ];

  // Display name (optional).
  string nickname = 4 [
    (buf.validate.field) = {string: {max_len: 64}},
    (validate.v1.error_message) = "nickname must be at most 64 characters"
  ];

  // Phone number (optional).
  string phone = 5 [
    (buf.validate.field) = {string: {max_len: 32}},
    (validate.v1.error_message) = "phone must be at most 32 characters"
  ];
}

// RegisterResponse is the response for Register.
message RegisterResponse {
  // ID of the newly created user (snowflake int64; JSON string via protojson).
  int64 user_id = 1;

  // Login username.
  string username = 2;

  // Email address.
  string email = 3;
}

// LoginRequest is the request for Login.
message LoginRequest {
  // Login username.
  string username = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (validate.v1.error_message) = "username is required"
  ];

  // Plain-text password.
  string password = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (validate.v1.error_message) = "password is required"
  ];
}

// TokenPair is a pair of access and refresh tokens.
message TokenPair {
  // Short-lived access token (JWT, default 2h).
  string access_token = 1;

  // Long-lived refresh token (JWT, default 7d).
  string refresh_token = 2;

  // Access token TTL in seconds.
  int64 expires_in = 3;

  // Token type. Always "Bearer".
  string token_type = 4;
}

// LoginResponse is the response for Login.
message LoginResponse {
  TokenPair tokens = 1;

  // User ID (snowflake int64; JSON string via protojson).
  int64 user_id = 2;

  // Login username.
  string username = 3;
}

// LogoutRequest is the request for Logout.
message LogoutRequest {
  // The access token to invalidate. Optional: when omitted, the token is taken
  // from the Authorization header, which the auth middleware already validates.
  string access_token = 1;
}

// LogoutResponse is the response for Logout.
message LogoutResponse {}

// RefreshTokenRequest is the request for RefreshToken.
message RefreshTokenRequest {
  // A valid refresh token.
  string refresh_token = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (validate.v1.error_message) = "refresh_token is required"
  ];
}

// RefreshTokenResponse is the response for RefreshToken.
message RefreshTokenResponse {
  TokenPair tokens = 1;
}

// ChangePasswordRequest is the request for ChangePassword.
message ChangePasswordRequest {
  // Current password for verification.
  string old_password = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (validate.v1.error_message) = "old_password is required"
  ];

  // New password. Must be 8-72 characters (bcrypt caps input at 72 bytes).
  string new_password = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {min_len: 8, max_len: 72}
    },
    (validate.v1.error_message) = "new_password is required and must be between 8 and 72 characters"
  ];
}

// ChangePasswordResponse is the response for ChangePassword.
message ChangePasswordResponse {}
