syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "kratos-micro-layout/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "user.v1";

// UserService serves the authenticated caller's own account. This template has
// no RBAC and no admin surface: accounts are created through
// AuthService.Register, so every RPC here is self-scoped — the caller identity
// comes from the verified bearer token, never from the request.
service UserService {
  option (google.api.default_host) = "user.example.com";

  // GetProfile returns the caller's own account.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (google.api.http) = {get: "/v1/users/profile"};
  }

  // UpdateProfile patches the caller's own profile fields. Identity fields
  // (username, email) and server-assigned fields are not patchable here.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/users/profile"
      body: "*"
    };
  }
}

// UserStatus is the lifecycle state of a user account.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
  USER_STATUS_DELETED = 3;
}

// User is the user account resource. It is read-only on the wire: writes go
// through UpdateProfile (profile fields) and AuthService (credentials), so the
// resource carries no validation rules of its own.
message User {
  // Unique identifier (snowflake int64). Serialised as a JSON string by
  // protojson so the 64-bit value stays precise in JavaScript clients.
  int64 id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Login username. Unique across the system; assigned at registration.
  string username = 2 [(google.api.field_behavior) = REQUIRED];

  // Email address. Unique across the system; assigned at registration.
  string email = 3 [(google.api.field_behavior) = REQUIRED];

  // Phone number (optional).
  string phone = 4;

  // Display name.
  string nickname = 5;

  // Avatar URL.
  string avatar = 6;

  // Lifecycle status. Server-assigned; reads filter out deleted accounts.
  UserStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Server-assigned creation timestamp.
  google.protobuf.Timestamp created_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Server-assigned last-update timestamp.
  google.protobuf.Timestamp updated_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// GetProfileRequest is the request message for GetProfile. The caller identity
// comes from the access token, so the request carries no fields.
message GetProfileRequest {}

// GetProfileResponse is the response message for GetProfile.
message GetProfileResponse {
  // The caller's own account.
  User user = 1;
}

// UpdateProfileRequest is the request message for UpdateProfile. Only the
// profile fields are patchable; update_mask selects which of them to apply. A
// selected field is written with whatever value the request carries — leaving it
// empty clears it — while an unselected field keeps its stored value.
// Constraints use protovalidate's standard rules; IGNORE_IF_ZERO_VALUE keeps an
// unselected field's zero value from tripping them. A rejected field reports
// protovalidate's own message, prefixed with the field path.
message UpdateProfileRequest {
  // Phone number (optional).
  string phone = 1 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {max_len: 32}
  }];

  // Display name.
  string nickname = 2 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {max_len: 64}
  }];

  // Avatar URL.
  string avatar = 3 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {max_len: 512}
  }];

  // Field mask over the patchable profile fields: phone, nickname, avatar.
  // Selecting a field writes it (an empty value clears it); unselected fields
  // are left alone. No standard rule expresses "at least one path", so this one
  // field keeps a CEL rule, which carries its own message.
  google.protobuf.FieldMask update_mask = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      cel: {
        id: "update_mask.paths"
        message: "update_mask must select at least one of: phone, nickname, avatar"
        expression: "this.paths.size() > 0"
      }
    }
  ];
}

// UpdateProfileResponse is the response message for UpdateProfile.
message UpdateProfileResponse {
  // The updated account.
  User user = 1;
}
